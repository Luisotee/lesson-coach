[project]
name = "lesson-coach-backend"
version = "0.1.0"
description = "Lesson Coach API: sympy math core, packs and live diagnosis."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pyyaml>=6.0.3",
    "sympy>=1.13",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# sympy ships no type information.
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Math input uses Unicode operators (−, ×, ÷) on purpose.
"app/math/**" = ["RUF001", "RUF002", "RUF003"]
"tests/math/**" = ["RUF001", "RUF002", "RUF003"]
