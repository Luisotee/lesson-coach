<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson Coach — step on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Figtree:wght@500;600;700;800&amp;family=Kalam:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#357CA2}a:hover{color:#172B53}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes dim{from{opacity:0}to{opacity:1}}
@keyframes reveal{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.step{transition:background-color .25s ease,border-color .25s ease,transform .15s ease}
.step:active{transform:scale(.98)}
.seg{transition:background-color .2s ease,color .2s ease}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .12em}.fr>span:first-child{padding:0 .22em .08em}.fr>span:last-child{border-top:2px solid currentColor;padding:.08em .22em 0}.paper{background-color:#FFFFFF;background-image:linear-gradient(#E4EDF6 1px,transparent 1px),linear-gradient(90deg,#E4EDF6 1px,transparent 1px);background-size:22px 22px}@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}@keyframes marker{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #172B53; background: #F6F7F9">
  <div style="padding: 16px 16px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E2E5E8; background: #FFFFFF">
    <a href="#" aria-label="Back to all topics" style="width: 44px; height: 44px; margin-left: -8px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #172B53">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <span style="font-size: 12px; color: #6B7280">Grade 7–8 · Algebra</span>
      <span style="font-family: Figtree, sans-serif; font-weight: 600; font-size: 17px">Solving linear equations</span>
    </div>
  </div>

  <div style="padding: 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: .01em; text-transform: lowercase; color: #6B7280">Worked example 1 of 3</div>
    <div style="font-family: Figtree, sans-serif; font-size: 22px; font-weight: 600">Solve <span style="font-family: Kalam, 'Comic Neue', cursive; font-weight: 400">3<i>x</i> + 5 = 20</span></div>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <button type="button" class="step" onClick="{{s.pick}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; border-radius: 16px; border: 1px solid {{s.border}}; background: {{s.bg}}; text-align: left; font: inherit; color: inherit; cursor: pointer">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: {{s.dotBg}}; color: {{s.dotInk}}">{{s.n}}</span>
        <span style="display: flex; flex-direction: column; min-width: 0">
          <span style="font-family: Kalam, 'Comic Neue', cursive; font-size: 22px">{{s.math}}</span>
          <span style="font-size: 13px; color: #5B6475">{{s.op}}</span>
        </span>
      </button>
    </sc-for>
    <span style="margin-top: 4px; font-size: 13px; color: #5B6475; text-align: center">Tap a step to see why it works</span>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23,43,83,.32); animation: dim .4s ease both"></div>

  <div role="dialog" aria-label="Why this step works" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 28px; border-radius: 24px 24px 0 0; background: #FFFFFF; box-shadow: 0 -20px 50px -20px rgba(23,43,83,.45); animation: sheetUp .55s cubic-bezier(.2,.9,.2,1) both">
    <div style="width: 40px; height: 5px; margin: 0 auto 14px; border-radius: 999px; background: #C4C7CA"></div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <span style="font-size: 13px; font-weight: 600; color: #357CA2">Step {{cur.n}} · {{cur.op}}</span>
      <span style="font-family: Kalam, 'Comic Neue', cursive; font-size: 20px">{{cur.math}}</span>
    </div>
    <div role="tablist" aria-label="Explanation style" style="display: flex; gap: 4px; margin-top: 14px; padding: 4px; border-radius: 12px; background: #EAEEF2">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{m.selected}}" class="seg" onClick="{{m.pick}}" style="flex: 1 1 0; min-height: 44px; border: 0; border-radius: 9px; background: {{m.bg}}; color: {{m.ink}}; box-shadow: {{m.shadow}}; font: 600 14px Inter, sans-serif; cursor: pointer">{{m.label}}</button>
      </sc-for>
    </div>
    <sc-if value="{{showWhy}}" hint-placeholder-val="{{true}}">
      <p style="margin: 16px 0 0; font-size: 17px; line-height: 1.6; animation: reveal .4s cubic-bezier(.2,.8,.2,1) both">{{cur.why}}</p>
    </sc-if>
    <sc-if value="{{showAnother}}" hint-placeholder-val="{{false}}">
      <p style="margin: 16px 0 0; font-size: 17px; line-height: 1.6; animation: reveal .4s cubic-bezier(.2,.8,.2,1) both">{{cur.another}}</p>
    </sc-if>
    <sc-if value="{{showVisual}}" hint-placeholder-val="{{false}}">
      <div style="margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: reveal .4s cubic-bezier(.2,.8,.2,1) both">
        <div style="width: 100%; display: flex; gap: 12px">
          <div style="flex: 1 1 0; min-height: 52px; border-radius: 10px; background: #E7F6FE; border: 1px solid #B5E2F8; display: flex; align-items: center; justify-content: center; gap: 4px; font-family: Kalam, 'Comic Neue', cursive; font-size: 18px; color: #172B53">{{cur.leftText}}</div>
          <div style="flex: 1 1 0; min-height: 52px; border-radius: 10px; background: #FFFBEB; border: 1px solid #FDE68A; display: flex; align-items: center; justify-content: center; font-family: Kalam, 'Comic Neue', cursive; font-size: 20px; color: #92400E">{{cur.right}}</div>
        </div>
        <div style="width: 100%; height: 5px; border-radius: 999px; background: #3A4458"></div>
        <svg width="40" height="28" viewBox="0 0 56 40" aria-hidden="true"><path d="M28 0L52 40H4z" fill="#3A4458"></path></svg>
        <span style="font-size: 14px; color: #3A4458; text-align: center">{{cur.caption}}</span>
      </div>
    </sc-if>
    <div style="margin-top: 18px; display: flex; gap: 10px">
      <button type="button" onClick="{{prev}}" style="flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 1px solid #E2E5E8; background: #FFFFFF; font: 600 15px Inter, sans-serif; color: #172B53; cursor: pointer">Previous step</button>
      <button type="button" onClick="{{next}}" style="flex: 1 1 0; min-height: 48px; border-radius: 12px; border: 0; background: #172B53; font: 600 15px Inter, sans-serif; color: #FFFFFF; cursor: pointer">Next step</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, mode: 'why' };
  }
  renderVals() {
    const st = this.state;
    const raw = [
      { math: '3x + 5 = 20', op: 'Read the equation', why: 'Read it as a balance: three equal unknown amounts plus 5 weigh the same as 20.', another: 'Ask: what number, times 3, plus 5, makes 20?', leftText: 'x x x + 5', right: '20', caption: 'Three x’s and 5 balance 20.' },
      { math: '3x = 15', op: 'Subtract 5 from both sides', why: 'Taking 5 from only one side would tip the balance. Taking it from both keeps the sides equal.', another: 'Undo the last thing done to x. The 5 was added last, so it comes off first.', leftText: 'x x x', right: '15', caption: 'Remove 5 from each pan. Still balanced.' },
      { math: 'x = 5', op: 'Divide both sides by 3', why: 'Three equal x’s weigh 15, so one x weighs a third of 15: 5.', another: 'Share 15 into 3 equal groups. Each group is 5.', leftText: 'x', right: '5', caption: 'One x balances 5.' }
    ];
    const steps = raw.map((s, i) => {
      const on = i === st.step;
      return Object.assign({}, s, { n: i + 1, bg: on ? '#E7F6FE' : '#FFFFFF', border: on ? '#8CCDEE' : '#E2E5E8', dotBg: on ? '#172B53' : '#EEF1F4', dotInk: on ? '#FFFFFF' : '#5B6475', pick: () => this.setState({ step: i }) });
    });
    const modes = [['why', 'Why?'], ['another', 'Another way'], ['visual', 'Picture']].map(([id, label]) => {
      const sel = st.mode === id;
      return { label: label, selected: sel ? 'true' : 'false', bg: sel ? '#FFFFFF' : 'transparent', ink: sel ? '#172B53' : '#5B6475', shadow: sel ? '0 1px 2px rgba(23,43,83,.08), 0 4px 12px -6px rgba(23,43,83,.2)' : 'none', pick: () => this.setState({ mode: id }) };
    });
    return {
      steps: steps,
      cur: steps[st.step],
      modes: modes,
      showWhy: st.mode === 'why',
      showAnother: st.mode === 'another',
      showVisual: st.mode === 'visual',
      prev: () => this.setState({ step: Math.max(0, st.step - 1) }),
      next: () => this.setState({ step: Math.min(2, st.step + 1) })
    };
  }
}
</script>
</body>
</html>
